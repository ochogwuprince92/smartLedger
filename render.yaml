services:
  # Spring Boot Web Application
  - type: web
    name: smartledger-app
    runtime: docker
    env: docker
    plan: free
    dockerContext: .
    dockerfilePath: Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATASOURCE_URL
        value: jdbc:postgresql://your-database-host:5432/smartledger_db
      - key: DATASOURCE_USERNAME
        value: postgres
      - key: DATASOURCE_PASSWORD
        value: your_database_password
      - key: POSTGRES_DB
        value: smartledger_db
      # Redis - Set these in Render dashboard after deployment
      # - key: REDIS_HOST
      #   value: your-redis-cloud-host.com
      # - key: REDIS_PORT
      #   value: 6379
      # - key: REDIS_PASSWORD
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 86400000
      - key: ADMIN_EMAIL
        value: admin.smartledger@gmail.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: APP_BASE_URL
        value: https://smartledger-app.onrender.com
      # n8n - Set these in Render dashboard after deployment
      # - key: N8N_BASE_URL
      #   value: https://your-n8n-instance.com
      - key: N8N_WEBHOOK_PATH
        value: /webhook/finance-ai-insight
      - key: N8N_CALLBACK_SECRET
        generateValue: true
      # Mail - Set these in Render dashboard after deployment
      # - key: MAIL_HOST
      #   value: smtp.gmail.com
      # - key: MAIL_PORT
      #   value: 587
      # - key: MAIL_USERNAME
      #   value: your-email@gmail.com
      # - key: MAIL_PASSWORD
      - key: APP_EMAIL_ENABLED
        value: false
