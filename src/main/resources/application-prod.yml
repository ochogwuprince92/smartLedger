spring:
  datasource:
    url: ${DATASOURCE_URL}?sslMode=require
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 900000

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    validate-on-migrate: false
    baseline-on-migrate: true

server:
  port: ${PORT}

logging:
  level:
    com.finance.smartLedger: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN

app:
  scheduled:
    enabled: true
  base-url: ${APP_BASE_URL}
