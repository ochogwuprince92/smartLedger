spring:
  datasource:
    url: jdbc:tc:postgresql:15:///smartledger_test
    username: test
    password: test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    com.finance.smartLedger: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

app:
  scheduled:
    enabled: false
