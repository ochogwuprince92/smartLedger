<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Insights - SmartLedger</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/dashboard}">
                <i class="fas fa-chart-line me-2"></i>SmartLedger
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/fees}">Fee Management</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/payments}">Payments</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/ledger}">Ledger</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/reconciliation}">Reconciliation</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/reports}">Reports</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/ai-insights}">AI Insights</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h2 fw-bold">AI Insights</h1>
            <button class="btn btn-primary" onclick="generateInsights()">
                <i class="fas fa-brain me-2"></i>Generate Insights
            </button>
        </div>

        <!-- Insight Stats -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h6 class="card-title text-muted">Total Insights</h6>
                        <h3 class="fw-bold" id="totalInsights">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h6 class="card-title text-muted">Pending Review</h6>
                        <h3 class="fw-bold text-warning" id="pendingInsights">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h6 class="card-title text-muted">Resolved</h6>
                        <h3 class="fw-bold text-success" id="resolvedInsights">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h6 class="card-title text-muted">High Severity</h6>
                        <h3 class="fw-bold text-danger" id="highSeverityInsights">0</h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- Insights Table -->
        <div class="card">
            <div class="card-header bg-white">
                <div class="d-flex justify-content-between align-items-center">
                    <h5 class="card-title fw-bold mb-0">Recent AI Insights</h5>
                    <div>
                        <select class="form-select form-select-sm d-inline-block" style="width: auto;" id="severityFilter">
                            <option value="">All Severity</option>
                            <option value="HIGH">High</option>
                            <option value="MEDIUM">Medium</option>
                            <option value="LOW">Low</option>
                        </select>
                        <select class="form-select form-select-sm d-inline-block ms-2" style="width: auto;" id="statusFilter">
                            <option value="">All Status</option>
                            <option value="PENDING">Pending</option>
                            <option value="REVIEWED">Reviewed</option>
                            <option value="RESOLVED">Resolved</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Insight Type</th>
                                <th>Severity</th>
                                <th>Description</th>
                                <th>Generated At</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="insightsTableBody">
                            <!-- Dynamic content loaded via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = '/api/ai-insights';

        async function loadInsights() {
            try {
                const severity = document.getElementById('severityFilter').value;
                const status = document.getElementById('statusFilter').value;
                
                let url = `${API_BASE}/insights`;
                const params = new URLSearchParams();
                if (severity) params.append('severity', severity);
                if (status) params.append('status', status);
                if (params.toString()) url += '?' + params.toString();
                
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.success && data.data) {
                    renderInsights(data.data);
                    updateStats(data.data);
                }
            } catch (error) {
                console.error('Error loading insights:', error);
            }
        }

        function renderInsights(insights) {
            const tbody = document.getElementById('insightsTableBody');
            tbody.innerHTML = insights.map(insight => `
                <tr>
                    <td><span class="badge bg-secondary">${insight.insightType}</span></td>
                    <td><span class="badge ${getSeverityBadgeClass(insight.severity)}">${insight.severity}</span></td>
                    <td>${insight.description || insight.message || '-'}</td>
                    <td>${new Date(insight.generatedAt).toLocaleString()}</td>
                    <td><span class="badge ${getStatusBadgeClass(insight.status)}">${insight.status}</span></td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="viewInsight('${insight.id}')"><i class="fas fa-eye"></i></button>
                        ${insight.status === 'PENDING' ? `<button class="btn btn-sm btn-outline-success me-1" onclick="markAsReviewed('${insight.id}')"><i class="fas fa-check"></i></button>` : ''}
                        ${insight.status === 'REVIEWED' ? `<button class="btn btn-sm btn-outline-success me-1" onclick="markAsResolved('${insight.id}')"><i class="fas fa-check-double"></i></button>` : ''}
                        <button class="btn btn-sm btn-outline-secondary" onclick="dismissInsight('${insight.id}')"><i class="fas fa-times"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function getSeverityBadgeClass(severity) {
            switch(severity) {
                case 'HIGH': return 'bg-danger';
                case 'MEDIUM': return 'bg-warning';
                case 'LOW': return 'bg-info';
                default: return 'bg-secondary';
            }
        }

        function getStatusBadgeClass(status) {
            switch(status) {
                case 'PENDING': return 'bg-warning';
                case 'REVIEWED': return 'bg-info';
                case 'RESOLVED': return 'bg-success';
                case 'DISMISSED': return 'bg-secondary';
                default: return 'bg-secondary';
            }
        }

        function updateStats(insights) {
            document.getElementById('totalInsights').textContent = insights.length;
            document.getElementById('pendingInsights').textContent = insights.filter(i => i.status === 'PENDING').length;
            document.getElementById('resolvedInsights').textContent = insights.filter(i => i.status === 'RESOLVED').length;
            document.getElementById('highSeverityInsights').textContent = insights.filter(i => i.severity === 'HIGH').length;
        }

        async function generateInsights() {
            try {
                const response = await fetch(`${API_BASE}/insights/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                if (response.ok) {
                    loadInsights();
                }
            } catch (error) {
                console.error('Error generating insights:', error);
            }
        }

        async function markAsReviewed(id) {
            try {
                const response = await fetch(`${API_BASE}/insights/${id}/review`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                if (response.ok) {
                    loadInsights();
                }
            } catch (error) {
                console.error('Error marking insight as reviewed:', error);
            }
        }

        async function markAsResolved(id) {
            try {
                const response = await fetch(`${API_BASE}/insights/${id}/resolve`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                if (response.ok) {
                    loadInsights();
                }
            } catch (error) {
                console.error('Error marking insight as resolved:', error);
            }
        }

        async function dismissInsight(id) {
            try {
                const response = await fetch(`${API_BASE}/insights/${id}/dismiss`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                if (response.ok) {
                    loadInsights();
                }
            } catch (error) {
                console.error('Error dismissing insight:', error);
            }
        }

        function viewInsight(id) {
            window.location.href = `${API_BASE}/insights/${id}`;
        }

        // Filter change events
        document.getElementById('severityFilter').addEventListener('change', loadInsights);
        document.getElementById('statusFilter').addEventListener('change', loadInsights);

        // Load insights on page load
        document.addEventListener('DOMContentLoaded', loadInsights);
    </script>
</body>
</html>
