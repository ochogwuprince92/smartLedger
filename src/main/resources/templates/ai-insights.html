<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Insights - SmartLedger</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-light">
    <div th:replace="~{fragments/layout :: navbar('ai-insights')}"></div>
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h2 fw-bold">AI Insights</h1>
            <button class="btn btn-primary" onclick="generateInsights()" sec:authorize="hasAuthority('REPORT:GENERATE')">
                <i class="fas fa-brain me-2"></i>Generate Insights
            </button>
        </div>

        <!-- Insight Stats -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h6 class="card-title text-muted">Total Insights</h6>
                        <h3 class="fw-bold" id="totalInsights">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h6 class="card-title text-muted">Pending</h6>
                        <h3 class="fw-bold text-warning" id="pendingInsights">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h6 class="card-title text-muted">Completed</h6>
                        <h3 class="fw-bold text-success" id="completedInsights">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h6 class="card-title text-muted">High Risk</h6>
                        <h3 class="fw-bold text-danger" id="highRiskInsights">0</h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- Insights Table -->
        <div class="card">
            <div class="card-header bg-white">
                <div class="d-flex justify-content-between align-items-center">
                    <h5 class="card-title fw-bold mb-0">Recent AI Insights</h5>
                    <div>
                        <select class="form-select form-select-sm d-inline-block" style="width: auto;" id="riskFilter">
                            <option value="">All Risk Levels</option>
                            <option value="CRITICAL">Critical</option>
                            <option value="HIGH">High</option>
                            <option value="MEDIUM">Medium</option>
                            <option value="LOW">Low</option>
                        </select>
                        <select class="form-select form-select-sm d-inline-block ms-2" style="width: auto;" id="statusFilter">
                            <option value="">All Status</option>
                            <option value="PENDING">Pending</option>
                            <option value="PROCESSING">Processing</option>
                            <option value="COMPLETED">Completed</option>
                            <option value="FAILED">Failed</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Insight Type</th>
                                <th>Risk Level</th>
                                <th>Summary</th>
                                <th>Requested At</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="insightsTableBody">
                            <!-- Dynamic content loaded via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/layout :: scripts}"></div>
    <script>
        const API_BASE = '/api/v1/ai-insights';

        async function loadInsights() {
            try {
                const risk = document.getElementById('riskFilter').value;
                const status = document.getElementById('statusFilter').value;
                
                let url = API_BASE;
                const params = new URLSearchParams();
                if (risk) params.append('riskLevel', risk);
                if (status) params.append('status', status);
                if (params.toString()) url += '?' + params.toString();
                
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.success && data.data) {
                    renderInsights(data.data);
                    updateStats(data.data);
                }
            } catch (error) {
                console.error('Error loading insights:', error);
            }
        }

        function renderInsights(insights) {
            const tbody = document.getElementById('insightsTableBody');
            tbody.innerHTML = insights.map(insight => `
                <tr>
                    <td><span class="badge bg-secondary">${insight.insightType}</span></td>
                    <td><span class="badge ${getRiskBadgeClass(insight.riskLevel)}">${insight.riskLevel || 'N/A'}</span></td>
                    <td>${insight.summary || insight.description || '-'}</td>
                    <td>${new Date(insight.requestedAt).toLocaleString()}</td>
                    <td><span class="badge ${getStatusBadgeClass(insight.status)}">${insight.status}</span></td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="viewInsight('${insight.id}')"><i class="fas fa-eye"></i></button>
                        ${insight.status === 'FAILED' ? `<button class="btn btn-sm btn-outline-warning me-1" onclick="retryInsight()"><i class="fas fa-redo"></i></button>` : ''}
                    </td>
                </tr>
            `).join('');
        }

        function getRiskBadgeClass(riskLevel) {
            switch(riskLevel) {
                case 'CRITICAL': return 'bg-danger';
                case 'HIGH': return 'bg-danger';
                case 'MEDIUM': return 'bg-warning';
                case 'LOW': return 'bg-info';
                default: return 'bg-secondary';
            }
        }

        function getStatusBadgeClass(status) {
            switch(status) {
                case 'PENDING': return 'bg-warning';
                case 'PROCESSING': return 'bg-info';
                case 'COMPLETED': return 'bg-success';
                case 'FAILED': return 'bg-danger';
                default: return 'bg-secondary';
            }
        }

        function updateStats(insights) {
            document.getElementById('totalInsights').textContent = insights.length;
            document.getElementById('pendingInsights').textContent = insights.filter(i => i.status === 'PENDING').length;
            document.getElementById('completedInsights').textContent = insights.filter(i => i.status === 'COMPLETED').length;
            document.getElementById('highRiskInsights').textContent = insights.filter(i => i.riskLevel === 'HIGH' || i.riskLevel === 'CRITICAL').length;
        }

        async function retryInsight() {
            try {
                const response = await fetch(`${API_BASE}/retry-failed`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                if (response.ok) {
                    loadInsights();
                }
            } catch (error) {
                console.error('Error retrying insights:', error);
            }
        }

        function viewInsight(id) {
            window.location.href = `${API_BASE}/${id}`;
        }

        // Filter change events
        document.getElementById('riskFilter').addEventListener('change', loadInsights);
        document.getElementById('statusFilter').addEventListener('change', loadInsights);

        // Load insights on page load
        document.addEventListener('DOMContentLoaded', loadInsights);
    </script>
</body>
</html>
