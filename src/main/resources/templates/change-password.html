<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - SmartLedger</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .password-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 450px;
            width: 100%;
        }
        .password-header {
            background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
            border-radius: 16px 16px 0 0;
            padding: 30px;
            text-align: center;
        }
        .password-header h3 {
            color: white;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .password-header p {
            color: rgba(255,255,255,0.8);
            margin: 0;
        }
        .password-icon {
            font-size: 48px;
            color: white;
            margin-bottom: 15px;
        }
        .form-control {
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #e2e8f0;
        }
        .form-control:focus {
            border-color: #1e40af;
            box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.1);
        }
        .btn-change-password {
            background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        .btn-change-password:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #1e40af 0%, #2563eb 100%);
        }
        .input-group-text {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px 0 0 8px;
        }
        .password-strength {
            height: 4px;
            border-radius: 2px;
            margin-top: 8px;
            background: #e2e8f0;
        }
        .password-strength.weak { background: #ef4444; width: 33%; }
        .password-strength.medium { background: #f59e0b; width: 66%; }
        .password-strength.strong { background: #10b981; width: 100%; }
    </style>
</head>
<body>
    <div class="password-card">
        <div class="password-header">
            <div class="password-icon">
                <i class="fas fa-key"></i>
            </div>
            <h3>Change Password</h3>
            <p>Update your account password</p>
        </div>
        <div class="card-body p-4">
            <div th:if="${error}" class="alert alert-danger" role="alert">
                <i class="fas fa-exclamation-circle me-2"></i>
                <span th:text="${error}">Error message</span>
            </div>
            
            <div th:if="${success}" class="alert alert-success" role="alert">
                <i class="fas fa-check-circle me-2"></i>
                <span th:text="${success}">Password changed successfully</span>
            </div>
            
            <div th:if="${forced}" class="alert alert-warning" role="alert">
                <i class="fas fa-exclamation-triangle me-2"></i>
                <strong>Password Change Required:</strong> Your account has been reset with a temporary password. You must change your password before accessing other resources.
            </div>
            
            <form th:action="@{/change-password}" method="post">
                <div th:if="${!forced}" class="mb-3">
                    <label for="currentPassword" class="form-label fw-semibold">Current Password</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input type="password" class="form-control" id="currentPassword" name="currentPassword" 
                               placeholder="Enter current password" required>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="newPassword" class="form-label fw-semibold">New Password</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-key"></i>
                        </span>
                        <input type="password" class="form-control" id="newPassword" name="newPassword" 
                               placeholder="Enter new password" required minlength="8">
                    </div>
                    <div class="password-strength" id="passwordStrength"></div>
                    <small class="text-muted">Password must be at least 8 characters long</small>
                </div>
                
                <div class="mb-4">
                    <label for="confirmPassword" class="form-label fw-semibold">Confirm New Password</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-check"></i>
                        </span>
                        <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" 
                               placeholder="Confirm new password" required minlength="8">
                    </div>
                </div>
                
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-change-password">
                        <i class="fas fa-save me-2"></i>Change Password
                    </button>
                </div>
            </form>
            
            <div class="text-center mt-4">
                <a th:href="@{/dashboard}" class="text-decoration-none text-muted small">
                    <i class="fas fa-arrow-left me-1"></i>Back to Dashboard
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('newPassword').addEventListener('input', function() {
            const password = this.value;
            const strength = document.getElementById('passwordStrength');
            
            if (password.length < 8) {
                strength.className = 'password-strength weak';
            } else if (password.length < 12) {
                strength.className = 'password-strength medium';
            } else {
                strength.className = 'password-strength strong';
            }
        });
    </script>
</body>
</html>
