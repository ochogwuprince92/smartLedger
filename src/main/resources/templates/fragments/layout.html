<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - SmartLedger'">SmartLedger</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .navbar-brand {
            font-weight: 700;
        }
        .nav-link {
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .nav-link:hover {
            transform: translateY(-1px);
        }
        .nav-link.active {
            font-weight: 600;
        }
        /* Mobile menu improvements */
        @media (max-width: 767.98px) {
            .navbar-collapse {
                background: #0d6efd;
                padding: 1rem 0;
                border-radius: 0 0 8px 8px;
            }
            .nav-link {
                padding: 12px 20px !important;
                border-radius: 4px;
            }
            .nav-link:hover {
                background: rgba(255, 255, 255, 0.1);
            }
        }
        /* Touch target improvements */
        @media (max-width: 576px) {
            .btn, .form-control, .form-select {
                min-height: 44px;
            }
            .btn-sm {
                min-height: 38px;
            }
        }
        /* Table responsive handling */
        @media (max-width: 576px) {
            .table-responsive {
                border-radius: 8px;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
            .table {
                font-size: 0.875rem;
            }
            .table th, .table td {
                padding: 0.75rem 0.5rem;
            }
        }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top" th:fragment="navbar(activePage)">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/dashboard}">
                <i class="fas fa-chart-line me-2"></i>SmartLedger
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" 
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activePage == 'dashboard' ? 'active' : ''}" 
                           th:href="@{/dashboard}" sec:authorize="hasAuthority('DASHBOARD:READ')">
                            <i class="fas fa-home me-1"></i>Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activePage == 'fees' ? 'active' : ''}" 
                           th:href="@{/fees}" sec:authorize="hasAuthority('FEE:READ')">
                            <i class="fas fa-file-invoice-dollar me-1"></i>Fee Management
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activePage == 'payments' ? 'active' : ''}" 
                           th:href="@{/payments}" sec:authorize="hasAuthority('PAYMENT:READ')">
                            <i class="fas fa-credit-card me-1"></i>Payments
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activePage == 'ledger' ? 'active' : ''}" 
                           th:href="@{/ledger}" sec:authorize="hasAuthority('LEDGER:READ')">
                            <i class="fas fa-book me-1"></i>Ledger
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activePage == 'journal' ? 'active' : ''}" 
                           th:href="@{/journal}" sec:authorize="hasAuthority('JOURNAL:READ')">
                            <i class="fas fa-journal-whills me-1"></i>Journal
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activePage == 'reconciliation' ? 'active' : ''}" 
                           th:href="@{/reconciliation}" sec:authorize="hasAuthority('RECONCILIATION:READ')">
                            <i class="fas fa-balance-scale me-1"></i>Reconciliation
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activePage == 'reports' ? 'active' : ''}" 
                           th:href="@{/reports}" sec:authorize="hasAuthority('REPORT:READ')">
                            <i class="fas fa-chart-bar me-1"></i>Reports
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${activePage == 'ai-insights' ? 'active' : ''}" 
                           th:href="@{/ai-insights}" sec:authorize="hasAuthority('AI:READ')">
                            <i class="fas fa-brain me-1"></i>AI Insights
                        </a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" 
                           data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fas fa-user-circle me-1"></i>
                            <span sec:authentication="name">User</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                            <li><a class="dropdown-item" th:href="@{/change-password}">
                                <i class="fas fa-key me-2"></i>Change Password
                            </a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form th:action="@{/logout}" method="post">
                                    <button type="submit" class="dropdown-item">
                                        <i class="fas fa-sign-out-alt me-2"></i>Logout
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" 
            th:fragment="scripts"></script>
</body>
</html>
