<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ledger - SmartLedger</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/dashboard}">
                <i class="fas fa-chart-line me-2"></i>SmartLedger
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/fees}">Fee Management</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/payments}">Payments</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/ledger}">Ledger</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/reconciliation}">Reconciliation</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h2 fw-bold">Chart of Accounts</h1>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#createAccountModal">
                <i class="fas fa-plus me-2"></i>Create Account
            </button>
        </div>

        <!-- Account Stats -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h6 class="card-title text-muted">Total Accounts</h6>
                        <h3 class="fw-bold" id="totalAccounts">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h6 class="card-title text-muted">Assets</h6>
                        <h3 class="fw-bold text-primary" id="assetAccounts">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h6 class="card-title text-muted">Liabilities</h6>
                        <h3 class="fw-bold text-danger" id="liabilityAccounts">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h6 class="card-title text-muted">Equity</h6>
                        <h3 class="fw-bold text-success" id="equityAccounts">0</h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- Accounts Table -->
        <div class="card">
            <div class="card-header bg-white">
                <div class="d-flex justify-content-between align-items-center">
                    <h5 class="card-title fw-bold mb-0">Accounts</h5>
                    <input type="text" class="form-control form-control-sm" style="width: 250px;" placeholder="Search accounts..." id="searchAccounts">
                </div>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Account Number</th>
                                <th>Account Code</th>
                                <th>Account Name</th>
                                <th>Type</th>
                                <th>Balance</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="accountsTableBody">
                            <!-- Dynamic content loaded via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Account Modal -->
    <div class="modal fade" id="createAccountModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Create Account</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="createAccountForm">
                        <div class="mb-3">
                            <label class="form-label">Account Number</label>
                            <input type="text" class="form-control" id="accountNumber" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Account Code</label>
                            <input type="text" class="form-control" id="accountCode" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Account Name</label>
                            <input type="text" class="form-control" id="accountName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Account Type</label>
                            <select class="form-select" id="accountType" required>
                                <option value="ASSET">Asset</option>
                                <option value="LIABILITY">Liability</option>
                                <option value="EQUITY">Equity</option>
                                <option value="INCOME">Income</option>
                                <option value="EXPENSE">Expense</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Initial Balance</label>
                            <input type="number" class="form-control" id="initialBalance" step="0.01" value="0">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Currency</label>
                            <select class="form-select" id="currency">
                                <option value="USD">USD</option>
                                <option value="NGN">NGN</option>
                                <option value="GBP">GBP</option>
                                <option value="EUR">EUR</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" id="description" rows="2"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="createAccount()">Create Account</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = '/api/ledger';

        async function loadAccounts() {
            try {
                const response = await fetch(`${API_BASE}/accounts`);
                const data = await response.json();
                
                if (data.success && data.data) {
                    renderAccounts(data.data);
                    updateStats(data.data);
                }
            } catch (error) {
                console.error('Error loading accounts:', error);
            }
        }

        function renderAccounts(accounts) {
            const tbody = document.getElementById('accountsTableBody');
            tbody.innerHTML = accounts.map(account => `
                <tr>
                    <td>${account.accountNumber}</td>
                    <td>${account.accountCode}</td>
                    <td>${account.accountName}</td>
                    <td><span class="badge ${getAccountTypeBadgeClass(account.accountType)}">${account.accountType}</span></td>
                    <td>${account.currencyCode} ${account.balance}</td>
                    <td><span class="badge ${account.isActive ? 'bg-success' : 'bg-secondary'}">${account.isActive ? 'Active' : 'Inactive'}</span></td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="viewAccount('${account.id}')"><i class="fas fa-eye"></i></button>
                        <button class="btn btn-sm btn-outline-secondary me-1" onclick="viewTransactions('${account.id}')"><i class="fas fa-list"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function getAccountTypeBadgeClass(type) {
            switch(type) {
                case 'ASSET': return 'bg-primary';
                case 'LIABILITY': return 'bg-danger';
                case 'EQUITY': return 'bg-success';
                case 'INCOME': return 'bg-info';
                case 'EXPENSE': return 'bg-warning';
                default: return 'bg-secondary';
            }
        }

        function updateStats(accounts) {
            document.getElementById('totalAccounts').textContent = accounts.length;
            document.getElementById('assetAccounts').textContent = accounts.filter(a => a.accountType === 'ASSET').length;
            document.getElementById('liabilityAccounts').textContent = accounts.filter(a => a.accountType === 'LIABILITY').length;
            document.getElementById('equityAccounts').textContent = accounts.filter(a => a.accountType === 'EQUITY').length;
        }

        async function createAccount() {
            const account = {
                accountNumber: document.getElementById('accountNumber').value,
                accountCode: document.getElementById('accountCode').value,
                accountName: document.getElementById('accountName').value,
                accountType: document.getElementById('accountType').value,
                initialBalance: parseFloat(document.getElementById('initialBalance').value),
                currencyCode: document.getElementById('currency').value,
                description: document.getElementById('description').value
            };

            try {
                const response = await fetch(`${API_BASE}/accounts`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(account)
                });
                
                if (response.ok) {
                    bootstrap.Modal.getInstance(document.getElementById('createAccountModal')).hide();
                    loadAccounts();
                    document.getElementById('createAccountForm').reset();
                }
            } catch (error) {
                console.error('Error creating account:', error);
            }
        }

        function viewAccount(id) {
            window.location.href = `${API_BASE}/accounts/${id}`;
        }

        function viewTransactions(id) {
            window.location.href = `/api/journal/transactions?accountId=${id}`;
        }

        // Search functionality
        document.getElementById('searchAccounts').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            const rows = document.querySelectorAll('#accountsTableBody tr');
            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(searchTerm) ? '' : 'none';
            });
        });

        // Load accounts on page load
        document.addEventListener('DOMContentLoaded', loadAccounts);
    </script>
</body>
</html>
