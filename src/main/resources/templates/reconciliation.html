<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reconciliation - SmartLedger</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/dashboard}">
                <i class="fas fa-chart-line me-2"></i>SmartLedger
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/fees}">Fee Management</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/payments}">Payments</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/ledger}">Ledger</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/reconciliation}">Reconciliation</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h2 fw-bold">Reconciliation</h1>
            <button class="btn btn-primary" onclick="startReconciliation()">
                <i class="fas fa-sync me-2"></i>Start Reconciliation
            </button>
        </div>

        <!-- Reconciliation Stats -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h6 class="card-title text-muted">Total Reconciliations</h6>
                        <h3 class="fw-bold" id="totalReconciliations">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h6 class="card-title text-muted">Matched</h6>
                        <h3 class="fw-bold text-success" id="matchedCount">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h6 class="card-title text-muted">Unmatched</h6>
                        <h3 class="fw-bold text-warning" id="unmatchedCount">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <h6 class="card-title text-muted">Variance</h6>
                        <h3 class="fw-bold text-danger" id="varianceCount">0</h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- Reconciliations Table -->
        <div class="card">
            <div class="card-header bg-white">
                <div class="d-flex justify-content-between align-items-center">
                    <h5 class="card-title fw-bold mb-0">Recent Reconciliations</h5>
                    <div>
                        <select class="form-select form-select-sm d-inline-block" style="width: auto;" id="statusFilter">
                            <option value="">All Status</option>
                            <option value="COMPLETED">Completed</option>
                            <option value="IN_PROGRESS">In Progress</option>
                            <option value="FAILED">Failed</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Reconciliation ID</th>
                                <th>Period</th>
                                <th>Account</th>
                                <th>Matched Items</th>
                                <th>Unmatched Items</th>
                                <th>Variance</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="reconciliationsTableBody">
                            <!-- Dynamic content loaded via JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = '/api/reconciliation';

        async function loadReconciliations() {
            try {
                const status = document.getElementById('statusFilter').value;
                const url = status ? `${API_BASE}/reconciliations?status=${status}` : `${API_BASE}/reconciliations`;
                
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.success && data.data) {
                    renderReconciliations(data.data);
                    updateStats(data.data);
                }
            } catch (error) {
                console.error('Error loading reconciliations:', error);
            }
        }

        function renderReconciliations(reconciliations) {
            const tbody = document.getElementById('reconciliationsTableBody');
            tbody.innerHTML = reconciliations.map(rec => `
                <tr>
                    <td>${rec.reconciliationNumber || rec.id}</td>
                    <td>${rec.period || '-'}</td>
                    <td>${rec.accountName || '-'}</td>
                    <td>${rec.matchedCount || 0}</td>
                    <td>${rec.unmatchedCount || 0}</td>
                    <td>${rec.variance || '0.00'}</td>
                    <td><span class="badge ${getStatusBadgeClass(rec.status)}">${rec.status}</span></td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="viewReconciliation('${rec.id}')"><i class="fas fa-eye"></i></button>
                        ${rec.status === 'COMPLETED' ? `<button class="btn btn-sm btn-outline-success" onclick="downloadReport('${rec.id}')"><i class="fas fa-download"></i></button>` : ''}
                    </td>
                </tr>
            `).join('');
        }

        function getStatusBadgeClass(status) {
            switch(status) {
                case 'COMPLETED': return 'bg-success';
                case 'IN_PROGRESS': return 'bg-info';
                case 'FAILED': return 'bg-danger';
                case 'PENDING': return 'bg-warning';
                default: return 'bg-secondary';
            }
        }

        function updateStats(reconciliations) {
            document.getElementById('totalReconciliations').textContent = reconciliations.length;
            document.getElementById('matchedCount').textContent = reconciliations.reduce((sum, r) => sum + (r.matchedCount || 0), 0);
            document.getElementById('unmatchedCount').textContent = reconciliations.reduce((sum, r) => sum + (r.unmatchedCount || 0), 0);
            document.getElementById('varianceCount').textContent = reconciliations.filter(r => r.variance && parseFloat(r.variance) !== 0).length;
        }

        async function startReconciliation() {
            try {
                const response = await fetch(`${API_BASE}/reconciliations`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        period: new Date().toISOString().split('T')[0],
                        createdBy: 'system'
                    })
                });
                
                if (response.ok) {
                    loadReconciliations();
                }
            } catch (error) {
                console.error('Error starting reconciliation:', error);
            }
        }

        function viewReconciliation(id) {
            window.location.href = `${API_BASE}/reconciliations/${id}`;
        }

        function downloadReport(id) {
            window.open(`${API_BASE}/reconciliations/${id}/report`, '_blank');
        }

        // Status filter change event
        document.getElementById('statusFilter').addEventListener('change', loadReconciliations);

        // Load reconciliations on page load
        document.addEventListener('DOMContentLoaded', loadReconciliations);
    </script>
</body>
</html>
