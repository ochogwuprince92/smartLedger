spring:
  application:
    name: smartLedger

  datasource:
    url: jdbc:postgresql://localhost:5432/smartledger_db
    username: postgres
    password: ogwaa123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
        hbm2ddl:
          auto: none
        javax:
          persistence:
            schema-generation:
              database:
                action: none
        jakarta:
          persistence:
            schema-generation:
              database:
                action: none
        schema-management-tool: org.hibernate.tool.schema.internal.HibernateSchemaManagementTool
        validator:
          apply_to_ddl: false
        temp:
          use_jdbc_metadata_defaults: false
        integration:
          envers:
            enabled: false
        check_nullability: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false
    baseline-on-migrate: true

  # Disable Redis for tests
  data:
    redis:
      enabled: false
  
  # Disable cache for tests
  cache:
    type: none

  # Disable scheduled tasks for tests
  task:
    scheduling:
      pool:
        size: 1

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8081
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

app:
  # Disable scheduled tasks for tests
  scheduled:
    enabled: false
    pool-size: 1
  # Disable data loader for tests
  data-loader:
    enabled: false
  base-url: ${APP_BASE_URL:http://localhost:8081}
